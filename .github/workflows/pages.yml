name: Verify public website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@v5

      # GitHub Pages publishes main automatically using its native build workflow.
      # This check succeeds only once the public files match the pushed commit.
      - name: Wait for public website to match this commit
        env:
          SITE_URL: https://filmmakermudy.github.io/HSBraunUG/
        shell: python
        run: |
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          files = [Path('index.html')]
          for directory in ('css', 'js', 'public'):
              files.extend(p for p in Path(directory).rglob('*') if p.is_file())
          expected = {p: p.read_bytes() for p in files}
          deadline = time.monotonic() + 720
          while True:
              try:
                  for path, content in expected.items():
                      url = os.environ['SITE_URL'] + quote(path.as_posix())
                      url += '?version=' + os.environ['GITHUB_SHA']
                      request = Request(url, headers={'Cache-Control': 'no-cache'})
                      with urlopen(request, timeout=20) as response:
                          if response.read() != content:
                              raise ValueError(f'{path} still differs from this commit')
                  print('Public website matches commit ' + os.environ['GITHUB_SHA'])
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('Public website verified: ' + os.environ['SITE_URL'] + '\n')
                  break
              except (HTTPError, URLError, TimeoutError, ValueError) as error:
                  print(f'Waiting for GitHub Pages: {error}', flush=True)
                  if time.monotonic() >= deadline:
                      raise SystemExit('Public website did not update within 12 minutes')
                  time.sleep(10)
